cores: 2
features: keyctl=1,nesting=1,fuse=1
hostname: owncloud
memory: 1024
mp0: /data/app/nextcloud,mp=/mnt/data
mp1: /data/app/minio,mp=/mnt/minio
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.1.1,hwaddr=BC:24:11:CF:73:FE,ip=192.168.1.201/24,tag=20,type=veth
rootfs: data:subvol-201-disk-0,size=20G
tags: 192.168.1.201;cloud
unprivileged: 1

[before-upgrade]
hostname: old-name
mp0: /data/app/elsewhere,mp=/mnt/data
